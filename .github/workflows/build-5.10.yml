name: "Kernel Build (5.10)"

env:
  OUT_DIR: "out"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel Source Repository URL"
        required: true
        type: string
        default: "https://github.com/RapliVx/kernel-5.10.git"
      kernelBranch:
        description: "Kernel Branch"
        required: true
        type: string
        default: "ZeroTwo-Oplus"
      kernelDevice:
        description: "Target Device (for defconfig name)"
        required: true
        type: string
        default: "gki"
      localVersion:
        description: "Custom localversion (e.g., -GKI-Edition)"
        required: false
        type: string
        default: ""
      buildKSU:
        description: "Select Variants"
        required: true
        type: choice
        default: "all"
        options:
          - "vanilla"
          - "ksu"
          - "all"
      ksuLogging:
        description: "Enable KernelSU dmesg logging"
        required: false
        type: boolean
        default: true
      tickRate:
        description: "Kernel Tick Rate (Hz)"
        required: false
        type: choice
        default: "250Hz"
        options:
          - "default"
          - "100Hz"
          - "250Hz"
          - "300Hz"
          - "1000Hz"
      optimizationLevel:
        description: "Compiler Optimization Level"
        required: false
        type: choice
        default: "O2"
        options:
          - "default"
          - "O2"
          - "O3"
          - "Os"
      buildToolchain:
        description: "Select Build Toolchain"
        required: true
        type: choice
        default: "android-tools"
        options:
          - "android-tools"
          - "custom-tools"
      ltoType:
        description: "Link Time Optimization (LTO)"
        required: true
        type: choice
        default: "thin"
        options:
          - "thin"
          - "full"
          - "none"
      runKmiCheck:
        description: "Run KMI symbol CRC check (KMI_function_symbols_test.py)"
        required: false
        type: boolean
        default: true

jobs:
  build-kernel:
    name: "Build: ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      ci_version: ${{ steps.extract_version.outputs.CI_VERSION }}
      kernel_sha: ${{ steps.extract_version.outputs.KERNEL_SHA }}
      kernel_subject: ${{ steps.extract_version.outputs.KERNEL_SUBJECT }}
      clang_version: ${{ steps.extract_version.outputs.CLANG_VERSION }}
      kernel_release: ${{ steps.prepare_artifact.outputs.KERNEL_RELEASE }}
      build_start: ${{ steps.setup_env.outputs.BUILD_START }}
      kmi_status: ${{ steps.kmi_check.outputs.KMI_STATUS }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(
          github.event.inputs.buildKSU == 'all' && '["vanilla", "ksu"]' ||
          github.event.inputs.buildKSU == 'vanilla' && '["vanilla"]' ||
          '["ksu"]' ) }}
    env:
      WORK_DIR: workspace
      VARIANT: ${{ matrix.variant }}
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      KERNEL_URL: ${{ github.event.inputs.kernelSourceURL }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernelBranch }}
      LOCAL_VERSION: ${{ github.event.inputs.localVersion }}
      KSU_LOGGING: ${{ github.event.inputs.ksuLogging }}
      TICK_RATE: ${{ github.event.inputs.tickRate }}
      OPT_LEVEL: ${{ github.event.inputs.optimizationLevel }}
      BUILD_TOOLCHAIN: ${{ github.event.inputs.buildToolchain }}
      LTO_TYPE: ${{ github.event.inputs.ltoType }}
      RUN_KMI_CHECK: ${{ github.event.inputs.runKmiCheck }}

    steps:
      - name: "Setup Build Environment"
        id: setup_env
        run: |
          set -euo pipefail
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_OUTPUT"
          sudo apt-get update -qq
          COMMON_PKGS=(aria2 bc bison build-essential cpio curl dwarves flex git libelf-dev libssl-dev python3 rsync zip)
          if [ "$BUILD_TOOLCHAIN" = "android-tools" ]; then
            COMMON_PKGS+=(repo)
          else
            COMMON_PKGS+=(binutils-aarch64-linux-gnu device-tree-compiler kmod xz-utils zstd)
          fi
          sudo apt-get install -y --no-install-recommends "${COMMON_PKGS[@]}"
          mkdir -p "$WORK_DIR"

      # Clone kernel before syncing toolchains so bad URL, branch, or defconfig fails fast.
      - name: "Clone Custom Kernel Source"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -euo pipefail
          rm -rf common
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_URL" common
          if [ ! -f "common/arch/arm64/configs/${DEFCONFIG_NAME}" ]; then
            echo "Defconfig not found: common/arch/arm64/configs/${DEFCONFIG_NAME}" >&2
            exit 1
          fi

      - name: "Sync AOSP Tools & Clang r547379"
        if: github.event.inputs.buildToolchain == 'android-tools'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -euo pipefail
          if [ ! -f "common/build.config.gki.aarch64" ]; then
            echo "common/build.config.gki.aarch64 not found; use custom-tools for non-AOSP builds." >&2
            exit 1
          fi
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-lts --depth=1
          # Sync only build scripts and host prebuilts; skip AOSP common kernel and default clang.
          repo sync -c --no-tags --no-clone-bundle -j"$(nproc --all)" \
            build \
            prebuilts/gas/linux-x86 \
            prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8 \
            prebuilts/build-tools \
            prebuilts/kernel-build-tools
          rm -rf .repo
          aria2c -x 16 -s 16 -o clang.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r547379
          tar -xzf clang.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r547379
          rm -f clang.tar.gz
          if [ ! -x "prebuilts-master/clang/host/linux-x86/clang-r547379/bin/clang" ]; then
            echo "Executable clang binary not found in clang-r547379." >&2
            exit 1
          fi

      - name: "Retrieve Custom Toolchain"
        if: github.event.inputs.buildToolchain == 'custom-tools'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CLANG_URL=$(curl -sfL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/greenforce-project/greenforce_clang/releases/latest" \
            | python3 -c 'import json, sys; assets = json.load(sys.stdin).get("assets", []); print(next((a["browser_download_url"] for a in assets if a["name"].endswith((".tar.gz", ".tar.xz", ".tar.zst", ".tar.bz2"))), ""))')
          if [ -z "$CLANG_URL" ]; then
            echo "Failed to resolve greenforce_clang release asset URL." >&2
            exit 1
          fi
          mkdir -p clang
          ARCHIVE_NAME=$(basename "$CLANG_URL")
          aria2c -x 16 -s 16 -o "$ARCHIVE_NAME" -d clang "$CLANG_URL"
          tar -xf "clang/$ARCHIVE_NAME" -C clang
          rm -f "clang/$ARCHIVE_NAME"
          CLANG_BIN=$(find "$(pwd)/clang" -path "*/bin/clang" -xtype f -executable -printf '%h\n' -quit)
          if [ -z "$CLANG_BIN" ] || [ ! -x "$CLANG_BIN/clang" ]; then
            echo "Executable clang binary not found in extracted toolchain." >&2
            exit 1
          fi
          echo "CLANG_PATH=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: "Setup Swap 20GB"
        # Pinned to master commit with ext4/btrfs fallocate handling (2025-05-08).
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 20

      - name: "Integrate KernelSU"
        if: matrix.variant == 'ksu'
        working-directory: ${{ env.WORK_DIR }}/common
        run: |
          set -euo pipefail
          rm -rf ./KernelSU ./KernelSU-Next ./drivers/kernelsu
          curl -sfSL "https://raw.githubusercontent.com/RapliVx/KernelSU/xxksu/kernel/setup.sh" | bash -s xxksu
          if [ ! -e "drivers/kernelsu/Kconfig" ]; then
            ln -sfn ../KernelSU/kernel drivers/kernelsu
          fi

      - name: "Configure Kernel Features"
        working-directory: ${{ env.WORK_DIR }}/common
        run: |
          set -euo pipefail
          CONFIG_FILE="arch/arm64/configs/${DEFCONFIG_NAME}"

          # Write LOCALVERSION via Python so '/', '&', and quotes never break sed.
          if [ -n "$LOCAL_VERSION" ]; then
            python3 - "$CONFIG_FILE" "$LOCAL_VERSION" << 'PY'
          import sys
          path, value = sys.argv[1], sys.argv[2]
          escaped = value.replace("\\", "\\\\").replace('"', '\\"')
          with open(path, "r", encoding="utf-8") as f:
              lines = [l for l in f if not l.startswith("CONFIG_LOCALVERSION=") and l.strip() != "# CONFIG_LOCALVERSION is not set"]
          lines.append(f'CONFIG_LOCALVERSION="{escaped}"\n')
          with open(path, "w", encoding="utf-8") as f:
              f.writelines(lines)
          PY
          fi

          case "$LTO_TYPE" in
            none)
              ./scripts/config --file "$CONFIG_FILE" \
                -d LTO_CLANG -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO
              ;;
            thin)
              ./scripts/config --file "$CONFIG_FILE" \
                -e LTO_CLANG -d LTO_NONE -e LTO_CLANG_THIN -d LTO_CLANG_FULL -e THINLTO
              ;;
            full)
              ./scripts/config --file "$CONFIG_FILE" \
                -e LTO_CLANG -d LTO_NONE -d LTO_CLANG_THIN -e LTO_CLANG_FULL -d THINLTO
              ;;
          esac

          if [ "$OPT_LEVEL" != "default" ]; then
            case "$OPT_LEVEL" in
              O2)
                ./scripts/config --file "$CONFIG_FILE" \
                  -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3 -d CC_OPTIMIZE_FOR_SIZE
                ;;
              O3)
                # CC_OPTIMIZE_FOR_PERFORMANCE_O3 depends on ARC; keep O2 here and pass -O3 via KCFLAGS.
                ./scripts/config --file "$CONFIG_FILE" \
                  -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3 -d CC_OPTIMIZE_FOR_SIZE
                ;;
              Os)
                ./scripts/config --file "$CONFIG_FILE" \
                  -d CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3 -e CC_OPTIMIZE_FOR_SIZE
                ;;
            esac
          fi

          if [ "$TICK_RATE" != "default" ]; then
            HZ_VAL="${TICK_RATE%Hz}"
            ./scripts/config --file "$CONFIG_FILE" \
              -e NO_HZ_IDLE -d HZ_PERIODIC -d NO_HZ_FULL \
              -d HZ_100 -d HZ_250 -d HZ_300 -d HZ_1000 \
              -e "HZ_${HZ_VAL}" --set-val HZ "$HZ_VAL"
          fi

          sed -i '/CONFIG_KSU/d' "$CONFIG_FILE"
          if [ "$VARIANT" = "ksu" ]; then
            ./scripts/config --file "$CONFIG_FILE" \
              -e KSU \
              -e KSU_LSM_SECURITY_HOOKS \
              -e KSU_FEATURE_SULOG \
              -e KSU_FEATURE_ADBROOT \
              -e KSU_HACK_ARM64_BRANCH_LINK \
              -d KSU_TAMPER_SYSCALL_TABLE \
              -d KSU_KPROBES_KSUD \
              -e KSU_HOSTSREDIRECT \
              -e KSU_ENABLE_FULL_UID_CHECKS \
              -e KSU_THRONE_TRACKER_ALWAYS_THREADED \
              -d KSU_SHELL_HAS_SU_ALWAYS \
              -d KSU_DEBUG
            if [ "$KSU_LOGGING" = "true" ]; then
              ./scripts/config --file "$CONFIG_FILE" -d KSU_NOPRINTK
            else
              ./scripts/config --file "$CONFIG_FILE" -e KSU_NOPRINTK
            fi
          else
            ./scripts/config --file "$CONFIG_FILE" -d KSU
          fi

      - name: "Extract Kernel Version"
        id: extract_version
        working-directory: ${{ env.WORK_DIR }}/common
        run: |
          set -euo pipefail
          FULL_VER=$(make -s kernelversion 2>/dev/null || true)
          if [ -z "$FULL_VER" ]; then
            K_VER=$(awk -F '=' '/^VERSION[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2; exit}' Makefile)
            K_PATCH=$(awk -F '=' '/^PATCHLEVEL[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2; exit}' Makefile)
            K_SUB=$(awk -F '=' '/^SUBLEVEL[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2; exit}' Makefile)
            FULL_VER="${K_VER}.${K_PATCH}.${K_SUB}"
          fi
          if [ -z "$FULL_VER" ] || [ "$FULL_VER" = ".." ]; then
            echo "Failed to extract kernel version from Makefile." >&2
            exit 1
          fi
          K_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          K_SUBJ=$(git log -1 --pretty=%s 2>/dev/null | python3 -c 'import re, sys; s = re.sub(r"\s+", " ", sys.stdin.read()).strip(); print((s[:77] + "...") if len(s) > 80 else s)')
          if [ "$BUILD_TOOLCHAIN" = "android-tools" ]; then
            CLANG_BIN="../prebuilts-master/clang/host/linux-x86/clang-r547379/bin/clang"
          else
            CLANG_BIN="$(command -v clang || true)"
          fi
          CLANG_VER=""
          if [ -n "${CLANG_BIN:-}" ] && [ -x "$CLANG_BIN" ]; then
            CLANG_VER=$("$CLANG_BIN" --version 2>/dev/null | python3 -c 'import re, sys; lines = sys.stdin.read().splitlines(); line = lines[0] if lines else ""; print(re.sub(r"\s*\(https?://[^)]+\)", "", line).strip())')
          fi
          {
            echo "CI_VERSION=$FULL_VER"
            echo "KERNEL_SHA=$K_SHA"
            echo "KERNEL_SUBJECT=$K_SUBJ"
            echo "CLANG_VERSION=${CLANG_VER:-unknown}"
          } >> "$GITHUB_OUTPUT"
          echo "CI_VERSION=$FULL_VER" >> "$GITHUB_ENV"
          echo "Version Extracted: $FULL_VER (${K_SHA})"

      - name: "Build Kernel (AOSP)"
        if: github.event.inputs.buildToolchain == 'android-tools'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -euo pipefail
          cat > builder.config << EOF
          DEFCONFIG=${DEFCONFIG_NAME}
          CLANG_PREBUILT_BIN=prebuilts-master/clang/host/linux-x86/clang-r547379/bin
          EOF
          if [ "$OPT_LEVEL" = "O3" ]; then
            echo 'KCFLAGS="${KCFLAGS} -O3"' >> builder.config
          fi
          LTO="$LTO_TYPE" \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          BUILD_CONFIG_FRAGMENTS=builder.config \
          build/build.sh -j"$(nproc --all)"

      - name: "Build Kernel (Custom Toolchain)"
        if: github.event.inputs.buildToolchain == 'custom-tools'
        working-directory: ${{ env.WORK_DIR }}/common
        run: |
          set -euo pipefail
          mkdir -p "../${OUT_DIR}/dist"
          OUT_ABS="$(realpath "../${OUT_DIR}")"

          KCFLAGS_VAL=""
          if grep -q "__ANDROID_COMMON_KERNEL__" build.config.common 2>/dev/null; then
            KCFLAGS_VAL="-D__ANDROID_COMMON_KERNEL__"
          fi
          if [ "$OPT_LEVEL" = "O3" ]; then
            KCFLAGS_VAL="${KCFLAGS_VAL:+$KCFLAGS_VAL }-O3"
          fi

          MAKE_COMMON=(
            -j"$(nproc --all)"
            "O=${OUT_ABS}"
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          )
          make "${MAKE_COMMON[@]}" "$DEFCONFIG_NAME"
          if [ -n "$KCFLAGS_VAL" ]; then
            make "${MAKE_COMMON[@]}" "KCFLAGS=${KCFLAGS_VAL}" Image
          else
            make "${MAKE_COMMON[@]}" Image
          fi
          cp -f "${OUT_ABS}/arch/arm64/boot/Image" "${OUT_ABS}/dist/Image"

      - name: "Run KMI Symbol Check"
        id: kmi_check
        if: github.event.inputs.runKmiCheck == 'true'
        run: |
          set -euo pipefail
          KMI_SCRIPT="${WORK_DIR}/common/KMI_function_symbols_test.py"
          ABI_XML="${WORK_DIR}/common/android/abi_gki_aarch64.xml"
          SYMVERS_FILE=""
          for candidate in \
            "${WORK_DIR}/${OUT_DIR}/dist/vmlinux.symvers" \
            "${WORK_DIR}/${OUT_DIR}/common/vmlinux.symvers" \
            "${WORK_DIR}/${OUT_DIR}/vmlinux.symvers"; do
            if [ -s "$candidate" ]; then
              SYMVERS_FILE="$candidate"
              break
            fi
          done

          if [ ! -f "$KMI_SCRIPT" ]; then
            echo "KMI_function_symbols_test.py not found at ${KMI_SCRIPT}; skipping KMI check."
            echo "KMI_STATUS=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$ABI_XML" ] || [ -z "$SYMVERS_FILE" ]; then
            echo "Missing KMI inputs (xml: ${ABI_XML}, symvers: ${SYMVERS_FILE:-not found}); skipping KMI check."
            echo "KMI_STATUS=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! python3 -c "import lxml, rich" 2>/dev/null; then
            sudo apt-get install -y --no-install-recommends python3-lxml python3-rich \
              || python3 -m pip install --quiet --break-system-packages lxml rich
          fi

          # Pass explicit XML and symvers paths because builds output outside the kernel source tree.
          echo "Running KMI check with ${ABI_XML} and ${SYMVERS_FILE}"
          set +e
          COLUMNS=140 python3 "$KMI_SCRIPT" "$ABI_XML" "$SYMVERS_FILE"
          KMI_RC=$?
          set -e

          if [ "$KMI_RC" -eq 0 ]; then
            echo "KMI_STATUS=passed" >> "$GITHUB_OUTPUT"
          else
            echo "KMI_STATUS=failed" >> "$GITHUB_OUTPUT"
            exit "$KMI_RC"
          fi

      - name: "Prepare Artifact"
        id: prepare_artifact
        run: |
          set -euo pipefail
          mkdir -p output
          IMAGE_PATH="${WORK_DIR}/${OUT_DIR}/dist/Image"
          if [ ! -f "$IMAGE_PATH" ]; then
            echo "Built Image not found at $IMAGE_PATH" >&2
            exit 1
          fi
          cp -f "$IMAGE_PATH" "output/Image.${VARIANT}"
          K_RELEASE=""
          for rel_file in \
            "${WORK_DIR}/${OUT_DIR}/common/include/config/kernel.release" \
            "${WORK_DIR}/${OUT_DIR}/include/config/kernel.release"; do
            if [ -f "$rel_file" ]; then
              K_RELEASE=$(tr -d '\r\n' < "$rel_file")
              break
            fi
          done
          echo "KERNEL_RELEASE=${K_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: "Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: output/Image.${{ matrix.variant }}
          retention-days: 1

  package-release:
    name: "Release Packaging"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-kernel
    permissions:
      contents: write
    env:
      CI_VERSION: ${{ needs.build-kernel.outputs.ci_version }}
      KERNEL_SHA: ${{ needs.build-kernel.outputs.kernel_sha }}
      KERNEL_SUBJECT: ${{ needs.build-kernel.outputs.kernel_subject }}
      CLANG_VERSION: ${{ needs.build-kernel.outputs.clang_version }}
      KERNEL_RELEASE: ${{ needs.build-kernel.outputs.kernel_release }}
      BUILD_START: ${{ needs.build-kernel.outputs.build_start }}
      KERNEL_URL: ${{ github.event.inputs.kernelSourceURL }}
      KERNEL_DEVICE: ${{ github.event.inputs.kernelDevice }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernelBranch }}
      BUILD_KSU: ${{ github.event.inputs.buildKSU }}
      KSU_LOGGING: ${{ github.event.inputs.ksuLogging }}
      BUILD_TOOLCHAIN: ${{ github.event.inputs.buildToolchain }}
      LTO_TYPE: ${{ github.event.inputs.ltoType }}
      OPT_LEVEL: ${{ github.event.inputs.optimizationLevel }}
      TICK_RATE: ${{ github.event.inputs.tickRate }}
      LOCAL_VERSION: ${{ github.event.inputs.localVersion }}
      RUN_KMI_CHECK: ${{ github.event.inputs.runKmiCheck }}
      KMI_STATUS: ${{ needs.build-kernel.outputs.kmi_status }}
      TRIGGER_ACTOR: ${{ github.actor }}
    steps:
      - name: "Download Built Kernels"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "Create Variant Packages"
        run: |
          set -euo pipefail
          echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          if [ "${RUN_KMI_CHECK:-false}" != "true" ]; then
            KMI_CHECK_TEXT="disabled"
          elif [ "${KMI_STATUS:-}" = "skipped" ]; then
            KMI_CHECK_TEXT="skipped (missing KMI files)"
          elif [ -n "${KMI_STATUS:-}" ]; then
            KMI_CHECK_TEXT="${KMI_STATUS}"
          else
            KMI_CHECK_TEXT="enabled"
          fi
          echo "KMI_CHECK_TEXT=${KMI_CHECK_TEXT}" >> "$GITHUB_ENV"

          git clone --depth=1 https://github.com/RapliVx/AnyKernel3.git -b GKI-5.10 ak3_base
          rm -rf ak3_base/.git
          mkdir -p final_zips

          VARIANTS_MD=""
          IDX=1
          for variant in vanilla ksu; do
            IMG="./artifacts/kernel-${variant}/Image.${variant}"
            if [ -f "$IMG" ]; then
              echo "Packaging variant: $variant"
              cp -r ak3_base "ak3-$variant"
              cp -f "$IMG" "ak3-$variant/Image"

              ZIP_NAME="GKI-5.10-${CI_VERSION}-${variant^^}-$(date +'%Y%m%d').zip"
              (cd "ak3-$variant" && zip -r9 "../final_zips/$ZIP_NAME" . -x README.md)

              if [ "$variant" = "vanilla" ]; then
                VARIANTS_MD="${VARIANTS_MD}${IDX}. **Vanilla:** Standard Kernel."$'\n'
              else
                VARIANTS_MD="${VARIANTS_MD}${IDX}. **KSU:** KernelSU (xxksu)."$'\n'
              fi
              IDX=$((IDX + 1))
            fi
          done

          shopt -s nullglob
          ZIPS=(final_zips/*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No kernel ZIP packages were generated." >&2
            exit 1
          fi

          {
            echo "VARIANTS_MD<<EOF"
            printf '%s' "$VARIANTS_MD"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: "Push to GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: final_zips/*.zip
          tag_name: "Build-${{ github.run_number }}-${{ github.sha }}"
          name: "Kernel Build: ${{ env.CI_VERSION }}"
          body: |
            ### Build Info
            - **Date:** ${{ env.CURRENT_DATE }}
            - **Version:** `${{ env.CI_VERSION }}`
            - **Device:** `${{ env.KERNEL_DEVICE }}_defconfig`
            - **Branch:** `${{ env.KERNEL_BRANCH }}`
            - **Toolchain:** `${{ env.BUILD_TOOLCHAIN }}`
            - **Compiler:** LTO `${{ env.LTO_TYPE }}` | Opt `${{ env.OPT_LEVEL }}` | Tick `${{ env.TICK_RATE }}`
            - **KMI Check:** `${{ env.KMI_CHECK_TEXT }}`

            ### Variants
            ${{ env.VARIANTS_MD }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Send Telegram Status"
        if: success()
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not configured; skipping notification."
            exit 0
          fi

          MSG=$(python3 - <<'PY'
          import glob
          import hashlib
          import html
          import os
          import re
          import time

          def esc(val: str) -> str:
              return html.escape(val, quote=True)

          def format_source(url: str) -> str:
              clean = url.strip().rstrip("/")
              label = re.sub(r"\.git$", "", clean)
              m = re.match(r"^https?://github\.com/([^/]+/[^/]+)$", label)
              if m:
                  label = m.group(1)
              if clean.startswith(("http://", "https://")):
                  return f'<a href="{esc(clean)}">{esc(label)}</a>'
              return f"<code>{esc(label)}</code>"

          ci_ver = os.environ.get("CI_VERSION", "")
          k_release = os.environ.get("KERNEL_RELEASE", "").strip()
          k_url = os.environ.get("KERNEL_URL", "")
          k_branch = os.environ.get("KERNEL_BRANCH", "")
          k_sha = os.environ.get("KERNEL_SHA", "unknown")
          k_subj = os.environ.get("KERNEL_SUBJECT", "").strip()
          k_device = os.environ.get("KERNEL_DEVICE", "")
          local_ver = os.environ.get("LOCAL_VERSION", "").strip()
          build_ksu = os.environ.get("BUILD_KSU", "")
          ksu_log = os.environ.get("KSU_LOGGING", "true")
          run_kmi = os.environ.get("RUN_KMI_CHECK", "false")
          kmi_status = os.environ.get("KMI_STATUS", "").strip()
          toolchain = os.environ.get("BUILD_TOOLCHAIN", "")
          clang_ver = os.environ.get("CLANG_VERSION", "").strip()
          lto = os.environ.get("LTO_TYPE", "")
          opt = os.environ.get("OPT_LEVEL", "")
          tick = os.environ.get("TICK_RATE", "")
          actor = os.environ.get("TRIGGER_ACTOR", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_num = os.environ.get("GITHUB_RUN_NUMBER", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          gh_sha = os.environ.get("GITHUB_SHA", "")

          dur_text = ""
          start_raw = os.environ.get("BUILD_START", "").strip()
          if start_raw.isdigit():
              elapsed = max(0, int(time.time()) - int(start_raw))
              mins, secs = divmod(elapsed, 60)
              hrs, mins = divmod(mins, 60)
              dur_text = f"{hrs}h {mins}m {secs}s" if hrs else f"{mins}m {secs}s"

          if build_ksu == "vanilla":
              variant_line = "<code>vanilla</code>"
          else:
              log_state = "on" if ksu_log == "true" else "off"
              variant_line = f"<code>{esc(build_ksu)}</code> (xxksu, dmesg log: <code>{log_state}</code>)"

          if run_kmi != "true":
              kmi_line = "disabled"
          elif kmi_status == "skipped":
              kmi_line = "skipped (missing KMI files)"
          elif kmi_status:
              kmi_line = kmi_status
          else:
              kmi_line = "enabled"

          toolchain_line = f"<code>{esc(toolchain)}</code>"
          if clang_ver and clang_ver != "unknown":
              toolchain_line += f" (<code>{esc(clang_ver)}</code>)"

          zips = sorted(glob.glob("final_zips/*.zip"))
          pkg_lines = []
          for path in zips:
              size_mib = os.path.getsize(path) / (1024 * 1024)
              h = hashlib.sha256()
              with open(path, "rb") as fp:
                  while True:
                      chunk = fp.read(1 << 20)
                      if not chunk:
                          break
                      h.update(chunk)
              pkg_lines.append(
                  f"📦 <code>{esc(os.path.basename(path))}</code> ({size_mib:.2f} MiB)\n"
                  f"<code>sha256: {h.hexdigest()}</code>"
              )

          release_url = f"https://github.com/{repo}/releases/tag/Build-{run_num}-{gh_sha}"
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          lines = [
              f"<b>✅ GKI-5.10 Build Succeeded ({esc(ci_ver)})</b>",
              "",
              "<b>Kernel Info</b>",
          ]
          if k_release:
              lines.append(f"• Release: <code>{esc(k_release)}</code>")
          elif local_ver:
              lines.append(f"• Localversion: <code>{esc(local_ver)}</code>")
          lines.extend([
              f"• Device: <code>{esc(k_device)}_defconfig</code>",
              f"• Variants: {variant_line}",
              f"• KMI Check: <code>{esc(kmi_line)}</code>",
              f"• Source: {format_source(k_url)} @ <code>{esc(k_branch)}</code> (<code>{esc(k_sha)}</code>)",
          ])
          if k_subj:
              lines.append(f"• Last Commit: <i>{esc(k_subj)}</i>")
          lines.extend([
              "",
              "<b>Toolchain &amp; Compiler</b>",
              f"• Toolchain: {toolchain_line}",
              f"• Flags: LTO <code>{esc(lto)}</code> | Opt <code>{esc(opt)}</code> | Tick <code>{esc(tick)}</code>",
              "",
              "<b>Run Details</b>",
          ])
          run_meta = f"• Triggered by: <code>{esc(actor)}</code> | Run #{esc(run_num)}"
          if dur_text:
              run_meta += f" | {dur_text}"
          lines.extend([
              run_meta,
              f"• Builder Commit: <code>{esc(gh_sha[:7])}</code>",
              "",
              f"<b>Packages ({len(zips)})</b>",
              *pkg_lines,
              "",
              f'<a href="{esc(release_url)}">Download Release</a> • <a href="{esc(run_url)}">Workflow Logs</a>',
          ])
          print("\n".join(lines))
          PY
          )

          curl -sfS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=$MSG" > /dev/null

  notify-failure:
    name: "Notify Failure"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-kernel, package-release]
    if: ${{ always() && (needs.build-kernel.result == 'failure' || needs.package-release.result == 'failure') }}
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RESULT: ${{ needs.build-kernel.result }}
      PACKAGE_RESULT: ${{ needs.package-release.result }}
      KERNEL_URL: ${{ github.event.inputs.kernelSourceURL }}
      KERNEL_DEVICE: ${{ github.event.inputs.kernelDevice }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernelBranch }}
      BUILD_KSU: ${{ github.event.inputs.buildKSU }}
      KSU_LOGGING: ${{ github.event.inputs.ksuLogging }}
      LOCAL_VERSION: ${{ github.event.inputs.localVersion }}
      BUILD_TOOLCHAIN: ${{ github.event.inputs.buildToolchain }}
      LTO_TYPE: ${{ github.event.inputs.ltoType }}
      OPT_LEVEL: ${{ github.event.inputs.optimizationLevel }}
      TICK_RATE: ${{ github.event.inputs.tickRate }}
      RUN_KMI_CHECK: ${{ github.event.inputs.runKmiCheck }}
      KMI_STATUS: ${{ needs.build-kernel.outputs.kmi_status }}
      TRIGGER_ACTOR: ${{ github.actor }}
    steps:
      - name: "Send Telegram Failure Alert"
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not configured; skipping notification."
            exit 0
          fi

          JOBS_JSON=$(curl -sfS --max-time 10 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=50" 2>/dev/null || true)
          export JOBS_JSON

          MSG=$(python3 - <<'PY'
          import html
          import json
          import os
          import re

          def esc(val: str) -> str:
              return html.escape(val, quote=True)

          def format_source(url: str) -> str:
              clean = url.strip().rstrip("/")
              label = re.sub(r"\.git$", "", clean)
              m = re.match(r"^https?://github\.com/([^/]+/[^/]+)$", label)
              if m:
                  label = m.group(1)
              if clean.startswith(("http://", "https://")):
                  return f'<a href="{esc(clean)}">{esc(label)}</a>'
              return f"<code>{esc(label)}</code>"

          k_url = os.environ.get("KERNEL_URL", "")
          k_branch = os.environ.get("KERNEL_BRANCH", "")
          k_device = os.environ.get("KERNEL_DEVICE", "")
          local_ver = os.environ.get("LOCAL_VERSION", "").strip()
          build_ksu = os.environ.get("BUILD_KSU", "")
          ksu_log = os.environ.get("KSU_LOGGING", "true")
          run_kmi = os.environ.get("RUN_KMI_CHECK", "false")
          kmi_status = os.environ.get("KMI_STATUS", "").strip()
          toolchain = os.environ.get("BUILD_TOOLCHAIN", "")
          lto = os.environ.get("LTO_TYPE", "")
          opt = os.environ.get("OPT_LEVEL", "")
          tick = os.environ.get("TICK_RATE", "")
          actor = os.environ.get("TRIGGER_ACTOR", "")
          build_res = os.environ.get("BUILD_RESULT", "")
          pkg_res = os.environ.get("PACKAGE_RESULT", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_num = os.environ.get("GITHUB_RUN_NUMBER", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")

          if build_ksu == "vanilla":
              variant_line = "<code>vanilla</code>"
          else:
              log_state = "on" if ksu_log == "true" else "off"
              variant_line = f"<code>{esc(build_ksu)}</code> (xxksu, dmesg log: <code>{log_state}</code>)"

          kmi_failed = (kmi_status == "failed")
          failed_steps = []
          raw_jobs = os.environ.get("JOBS_JSON", "").strip()
          if raw_jobs:
              try:
                  jobs = json.loads(raw_jobs).get("jobs", [])
                  for job in jobs:
                      if job.get("conclusion") == "failure":
                          jname = job.get("name", "unknown")
                          bad_steps = [
                              s.get("name", "unknown")
                              for s in job.get("steps", [])
                              if s.get("conclusion") == "failure"
                          ]
                          if "Run KMI Symbol Check" in bad_steps:
                              kmi_failed = True
                          if bad_steps:
                              for sname in bad_steps:
                                  failed_steps.append(f"  - <code>{esc(jname)}</code> -> <code>{esc(sname)}</code>")
                          else:
                              failed_steps.append(f"  - <code>{esc(jname)}</code>")
              except Exception:
                  pass

          if run_kmi != "true":
              kmi_line = "disabled"
          elif kmi_failed:
              kmi_line = "failed"
          elif kmi_status == "skipped":
              kmi_line = "skipped (missing KMI files)"
          elif kmi_status == "passed":
              kmi_line = "passed"
          else:
              kmi_line = "enabled (not reached)"

          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"
          lines = [
              "<b>❌ GKI-5.10 Build Failed</b>",
              "",
              "<b>Build Config</b>",
              f"• Device: <code>{esc(k_device)}_defconfig</code>",
              f"• Variants: {variant_line}",
              f"• KMI Check: <code>{esc(kmi_line)}</code>",
              f"• Source: {format_source(k_url)} @ <code>{esc(k_branch)}</code>",
          ]
          if local_ver:
              lines.append(f"• Localversion: <code>{esc(local_ver)}</code>")
          lines.extend([
              f"• Toolchain: <code>{esc(toolchain)}</code> | LTO <code>{esc(lto)}</code> | Opt <code>{esc(opt)}</code> | Tick <code>{esc(tick)}</code>",
              "",
              "<b>Failure Details</b>",
              f"• Triggered by: <code>{esc(actor)}</code> | Run #{esc(run_num)}",
              f"• Jobs: build <code>{esc(build_res)}</code> | release <code>{esc(pkg_res)}</code>",
          ])
          if failed_steps:
              lines.append("• Failed step(s):")
              lines.extend(failed_steps)
          lines.extend([
              "",
              f'<a href="{esc(run_url)}">View Workflow Logs</a>',
          ])
          print("\n".join(lines))
          PY
          )

          curl -sfS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=$MSG" > /dev/null
