name: "Kernel Build (5.10)"

env:
  OUT_DIR: "out"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel Source Repository URL"
        required: true
        type: string
        default: "https://github.com/RapliVx/kernel-5.10.git"
      kernelBranch:
        description: "Kernel Branch"
        required: true
        type: string
        default: "ZeroTwo-Oplus"
      kernelDevice:
        description: "Target Device (for defconfig name)"
        required: true
        type: string
        default: "gki"
      localVersion:
        description: "Custom localversion (e.g., -GKI-Edition)"
        required: false
        type: string
        default: ""
      buildKSU:
        description: "Select Variants"
        required: true
        type: choice
        default: "all"
        options:
          - "vanilla"
          - "ksu"
          - "all"
      ksuLogging:
        description: "Enable KernelSU dmesg logging"
        required: false
        type: boolean
        default: true
      tickRate:
        description: "Kernel Tick Rate (Hz)"
        required: false
        type: choice
        default: "250Hz"
        options:
          - "default"
          - "100Hz"
          - "250Hz"
          - "300Hz"
          - "1000Hz"
      optimizationLevel:
        description: "Compiler Optimization Level"
        required: false
        type: choice
        default: "O2"
        options:
          - "default"
          - "O2"
          - "O3"
          - "Os"
      buildToolchain:
        description: "Select Build Toolchain"
        required: true
        type: choice
        default: "android-tools"
        options:
          - "android-tools"
          - "custom-tools"
      ltoType:
        description: "Link Time Optimization (LTO)"
        required: true
        type: choice
        default: "thin"
        options:
          - "thin"
          - "full"
          - "none"

jobs:
  build-kernel:
    name: "Build: ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      ci_version: ${{ steps.extract_version.outputs.CI_VERSION }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(
          github.event.inputs.buildKSU == 'all' && '["vanilla", "ksu"]' ||
          github.event.inputs.buildKSU == 'vanilla' && '["vanilla"]' ||
          '["ksu"]' ) }}
    env:
      WORK_DIR: workspace
      VARIANT: ${{ matrix.variant }}
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      KERNEL_URL: ${{ github.event.inputs.kernelSourceURL }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernelBranch }}
      LOCAL_VERSION: ${{ github.event.inputs.localVersion }}
      KSU_LOGGING: ${{ github.event.inputs.ksuLogging }}
      TICK_RATE: ${{ github.event.inputs.tickRate }}
      OPT_LEVEL: ${{ github.event.inputs.optimizationLevel }}
      BUILD_TOOLCHAIN: ${{ github.event.inputs.buildToolchain }}
      LTO_TYPE: ${{ github.event.inputs.ltoType }}

    steps:
      - name: "Setup Build Environment"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          COMMON_PKGS=(aria2 bc bison build-essential cpio curl dwarves flex git libelf-dev libssl-dev python3 rsync zip)
          if [ "$BUILD_TOOLCHAIN" = "android-tools" ]; then
            COMMON_PKGS+=(repo)
          else
            COMMON_PKGS+=(binutils-aarch64-linux-gnu device-tree-compiler kmod xz-utils zstd)
          fi
          sudo apt-get install -y --no-install-recommends "${COMMON_PKGS[@]}"
          mkdir -p "$WORK_DIR"

      # Clone kernel before syncing toolchains so bad URL, branch, or defconfig fails fast.
      - name: "Clone Custom Kernel Source"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -euo pipefail
          rm -rf common
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_URL" common
          if [ ! -f "common/arch/arm64/configs/${DEFCONFIG_NAME}" ]; then
            echo "Defconfig not found: common/arch/arm64/configs/${DEFCONFIG_NAME}" >&2
            exit 1
          fi

      - name: "Sync AOSP Tools & Clang r547379"
        if: github.event.inputs.buildToolchain == 'android-tools'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -euo pipefail
          if [ ! -f "common/build.config.gki.aarch64" ]; then
            echo "common/build.config.gki.aarch64 not found; use custom-tools for non-AOSP builds." >&2
            exit 1
          fi
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-lts --depth=1
          # Sync only build scripts and host prebuilts; skip AOSP common kernel and default clang.
          repo sync -c --no-tags --no-clone-bundle -j"$(nproc --all)" \
            build \
            prebuilts/gas/linux-x86 \
            prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8 \
            prebuilts/build-tools \
            prebuilts/kernel-build-tools
          rm -rf .repo
          aria2c -x 16 -s 16 -o clang.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r547379
          tar -xzf clang.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r547379
          rm -f clang.tar.gz
          if [ ! -x "prebuilts-master/clang/host/linux-x86/clang-r547379/bin/clang" ]; then
            echo "Executable clang binary not found in clang-r547379." >&2
            exit 1
          fi

      - name: "Retrieve Custom Toolchain"
        if: github.event.inputs.buildToolchain == 'custom-tools'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CLANG_URL=$(curl -sfL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/greenforce-project/greenforce_clang/releases/latest" \
            | python3 -c 'import json, sys; assets = json.load(sys.stdin).get("assets", []); print(next((a["browser_download_url"] for a in assets if a["name"].endswith((".tar.gz", ".tar.xz", ".tar.zst", ".tar.bz2"))), ""))')
          if [ -z "$CLANG_URL" ]; then
            echo "Failed to resolve greenforce_clang release asset URL." >&2
            exit 1
          fi
          mkdir -p clang
          ARCHIVE_NAME=$(basename "$CLANG_URL")
          aria2c -x 16 -s 16 -o "$ARCHIVE_NAME" -d clang "$CLANG_URL"
          tar -xf "clang/$ARCHIVE_NAME" -C clang
          rm -f "clang/$ARCHIVE_NAME"
          CLANG_BIN=$(find "$(pwd)/clang" -path "*/bin/clang" -xtype f -executable -printf '%h\n' -quit)
          if [ -z "$CLANG_BIN" ] || [ ! -x "$CLANG_BIN/clang" ]; then
            echo "Executable clang binary not found in extracted toolchain." >&2
            exit 1
          fi
          echo "CLANG_PATH=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: "Setup Swap 20GB"
        # Pinned to master commit with ext4/btrfs fallocate handling (2025-05-08).
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 20

      - name: "Integrate KernelSU"
        if: matrix.variant == 'ksu'
        working-directory: ${{ env.WORK_DIR }}/common
        run: |
          set -euo pipefail
          rm -rf ./KernelSU ./KernelSU-Next ./drivers/kernelsu
          curl -sfSL "https://raw.githubusercontent.com/RapliVx/KernelSU/xxksu/kernel/setup.sh" | bash -s xxksu
          if [ ! -e "drivers/kernelsu/Kconfig" ]; then
            ln -sfn ../KernelSU/kernel drivers/kernelsu
          fi

      - name: "Configure Kernel Features"
        working-directory: ${{ env.WORK_DIR }}/common
        run: |
          set -euo pipefail
          CONFIG_FILE="arch/arm64/configs/${DEFCONFIG_NAME}"

          # Write LOCALVERSION via Python so '/', '&', and quotes never break sed.
          if [ -n "$LOCAL_VERSION" ]; then
            python3 - "$CONFIG_FILE" "$LOCAL_VERSION" << 'PY'
          import sys
          path, value = sys.argv[1], sys.argv[2]
          escaped = value.replace("\\", "\\\\").replace('"', '\\"')
          with open(path, "r", encoding="utf-8") as f:
              lines = [l for l in f if not l.startswith("CONFIG_LOCALVERSION=") and l.strip() != "# CONFIG_LOCALVERSION is not set"]
          lines.append(f'CONFIG_LOCALVERSION="{escaped}"\n')
          with open(path, "w", encoding="utf-8") as f:
              f.writelines(lines)
          PY
          fi

          case "$LTO_TYPE" in
            none)
              ./scripts/config --file "$CONFIG_FILE" \
                -d LTO_CLANG -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO
              ;;
            thin)
              ./scripts/config --file "$CONFIG_FILE" \
                -e LTO_CLANG -d LTO_NONE -e LTO_CLANG_THIN -d LTO_CLANG_FULL -e THINLTO
              ;;
            full)
              ./scripts/config --file "$CONFIG_FILE" \
                -e LTO_CLANG -d LTO_NONE -d LTO_CLANG_THIN -e LTO_CLANG_FULL -d THINLTO
              ;;
          esac

          if [ "$OPT_LEVEL" != "default" ]; then
            case "$OPT_LEVEL" in
              O2)
                ./scripts/config --file "$CONFIG_FILE" \
                  -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3 -d CC_OPTIMIZE_FOR_SIZE
                ;;
              O3)
                # CC_OPTIMIZE_FOR_PERFORMANCE_O3 depends on ARC; keep O2 here and pass -O3 via KCFLAGS.
                ./scripts/config --file "$CONFIG_FILE" \
                  -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3 -d CC_OPTIMIZE_FOR_SIZE
                ;;
              Os)
                ./scripts/config --file "$CONFIG_FILE" \
                  -d CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3 -e CC_OPTIMIZE_FOR_SIZE
                ;;
            esac
          fi

          if [ "$TICK_RATE" != "default" ]; then
            HZ_VAL="${TICK_RATE%Hz}"
            ./scripts/config --file "$CONFIG_FILE" \
              -e NO_HZ_IDLE -d HZ_PERIODIC -d NO_HZ_FULL \
              -d HZ_100 -d HZ_250 -d HZ_300 -d HZ_1000 \
              -e "HZ_${HZ_VAL}" --set-val HZ "$HZ_VAL"
          fi

          sed -i '/CONFIG_KSU/d' "$CONFIG_FILE"
          if [ "$VARIANT" = "ksu" ]; then
            ./scripts/config --file "$CONFIG_FILE" \
              -e KSU \
              -e KSU_LSM_SECURITY_HOOKS \
              -e KSU_FEATURE_SULOG \
              -e KSU_FEATURE_ADBROOT \
              -e KSU_HACK_ARM64_BRANCH_LINK \
              -d KSU_TAMPER_SYSCALL_TABLE \
              -d KSU_KPROBES_KSUD \
              -e KSU_HOSTSREDIRECT \
              -e KSU_ENABLE_FULL_UID_CHECKS \
              -e KSU_THRONE_TRACKER_ALWAYS_THREADED \
              -d KSU_SHELL_HAS_SU_ALWAYS \
              -d KSU_DEBUG
            if [ "$KSU_LOGGING" = "true" ]; then
              ./scripts/config --file "$CONFIG_FILE" -d KSU_NOPRINTK
            else
              ./scripts/config --file "$CONFIG_FILE" -e KSU_NOPRINTK
            fi
          else
            ./scripts/config --file "$CONFIG_FILE" -d KSU
          fi

      - name: "Extract Kernel Version"
        id: extract_version
        working-directory: ${{ env.WORK_DIR }}/common
        run: |
          set -euo pipefail
          FULL_VER=$(make -s kernelversion 2>/dev/null || true)
          if [ -z "$FULL_VER" ]; then
            K_VER=$(awk -F '=' '/^VERSION[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2; exit}' Makefile)
            K_PATCH=$(awk -F '=' '/^PATCHLEVEL[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2; exit}' Makefile)
            K_SUB=$(awk -F '=' '/^SUBLEVEL[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2; exit}' Makefile)
            FULL_VER="${K_VER}.${K_PATCH}.${K_SUB}"
          fi
          if [ -z "$FULL_VER" ] || [ "$FULL_VER" = ".." ]; then
            echo "Failed to extract kernel version from Makefile." >&2
            exit 1
          fi
          echo "CI_VERSION=$FULL_VER" >> "$GITHUB_OUTPUT"
          echo "CI_VERSION=$FULL_VER" >> "$GITHUB_ENV"
          echo "Version Extracted: $FULL_VER"

      - name: "Build Kernel (AOSP)"
        if: github.event.inputs.buildToolchain == 'android-tools'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -euo pipefail
          cat > builder.config << EOF
          DEFCONFIG=${DEFCONFIG_NAME}
          CLANG_PREBUILT_BIN=prebuilts-master/clang/host/linux-x86/clang-r547379/bin
          EOF
          if [ "$OPT_LEVEL" = "O3" ]; then
            echo 'KCFLAGS="${KCFLAGS} -O3"' >> builder.config
          fi
          LTO="$LTO_TYPE" \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          BUILD_CONFIG_FRAGMENTS=builder.config \
          build/build.sh -j"$(nproc --all)"

      - name: "Build Kernel (Custom Toolchain)"
        if: github.event.inputs.buildToolchain == 'custom-tools'
        working-directory: ${{ env.WORK_DIR }}/common
        run: |
          set -euo pipefail
          mkdir -p "../${OUT_DIR}/dist"
          OUT_ABS="$(realpath "../${OUT_DIR}")"

          KCFLAGS_VAL=""
          if grep -q "__ANDROID_COMMON_KERNEL__" build.config.common 2>/dev/null; then
            KCFLAGS_VAL="-D__ANDROID_COMMON_KERNEL__"
          fi
          if [ "$OPT_LEVEL" = "O3" ]; then
            KCFLAGS_VAL="${KCFLAGS_VAL:+$KCFLAGS_VAL }-O3"
          fi

          MAKE_COMMON=(
            -j"$(nproc --all)"
            "O=${OUT_ABS}"
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          )
          make "${MAKE_COMMON[@]}" "$DEFCONFIG_NAME"
          if [ -n "$KCFLAGS_VAL" ]; then
            make "${MAKE_COMMON[@]}" "KCFLAGS=${KCFLAGS_VAL}" Image
          else
            make "${MAKE_COMMON[@]}" Image
          fi
          cp -f "${OUT_ABS}/arch/arm64/boot/Image" "${OUT_ABS}/dist/Image"

      - name: "Prepare Artifact"
        run: |
          set -euo pipefail
          mkdir -p output
          IMAGE_PATH="${WORK_DIR}/${OUT_DIR}/dist/Image"
          if [ ! -f "$IMAGE_PATH" ]; then
            echo "Built Image not found at $IMAGE_PATH" >&2
            exit 1
          fi
          cp -f "$IMAGE_PATH" "output/Image.${VARIANT}"

      - name: "Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: output/Image.${{ matrix.variant }}
          retention-days: 1

  package-release:
    name: "Release Packaging"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-kernel
    permissions:
      contents: write
    env:
      CI_VERSION: ${{ needs.build-kernel.outputs.ci_version }}
      KERNEL_DEVICE: ${{ github.event.inputs.kernelDevice }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernelBranch }}
      BUILD_TOOLCHAIN: ${{ github.event.inputs.buildToolchain }}
      LTO_TYPE: ${{ github.event.inputs.ltoType }}
      OPT_LEVEL: ${{ github.event.inputs.optimizationLevel }}
      TICK_RATE: ${{ github.event.inputs.tickRate }}
      LOCAL_VERSION: ${{ github.event.inputs.localVersion }}
    steps:
      - name: "Download Built Kernels"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "Create Variant Packages"
        run: |
          set -euo pipefail
          echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          git clone --depth=1 https://github.com/RapliVx/AnyKernel3.git -b GKI-5.10 ak3_base
          rm -rf ak3_base/.git
          mkdir -p final_zips

          VARIANTS_MD=""
          IDX=1
          for variant in vanilla ksu; do
            IMG="./artifacts/kernel-${variant}/Image.${variant}"
            if [ -f "$IMG" ]; then
              echo "Packaging variant: $variant"
              cp -r ak3_base "ak3-$variant"
              cp -f "$IMG" "ak3-$variant/Image"

              ZIP_NAME="GKI-5.10-${CI_VERSION}-${variant^^}-$(date +'%Y%m%d').zip"
              (cd "ak3-$variant" && zip -r9 "../final_zips/$ZIP_NAME" . -x README.md)

              if [ "$variant" = "vanilla" ]; then
                VARIANTS_MD="${VARIANTS_MD}${IDX}. **Vanilla:** Standard Kernel."$'\n'
              else
                VARIANTS_MD="${VARIANTS_MD}${IDX}. **KSU:** KernelSU (xxksu)."$'\n'
              fi
              IDX=$((IDX + 1))
            fi
          done

          shopt -s nullglob
          ZIPS=(final_zips/*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No kernel ZIP packages were generated." >&2
            exit 1
          fi

          {
            echo "VARIANTS_MD<<EOF"
            printf '%s' "$VARIANTS_MD"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: "Push to GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: final_zips/*.zip
          tag_name: "Build-${{ github.run_number }}-${{ github.sha }}"
          name: "Kernel Build: ${{ env.CI_VERSION }}"
          body: |
            ### Build Info
            - **Date:** ${{ env.CURRENT_DATE }}
            - **Version:** `${{ env.CI_VERSION }}`
            - **Device:** `${{ env.KERNEL_DEVICE }}_defconfig`
            - **Branch:** `${{ env.KERNEL_BRANCH }}`
            - **Toolchain:** `${{ env.BUILD_TOOLCHAIN }}`
            - **Compiler:** LTO `${{ env.LTO_TYPE }}` | Opt `${{ env.OPT_LEVEL }}` | Tick `${{ env.TICK_RATE }}`

            ### Variants
            ${{ env.VARIANTS_MD }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Send Telegram Status"
        if: success()
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not configured; skipping notification."
            exit 0
          fi

          shopt -s nullglob
          LIST=""
          for f in final_zips/*.zip; do
            NAME=$(python3 -c 'import html, os, sys; print(html.escape(os.path.basename(sys.argv[1])))' "$f")
            LIST="${LIST}📦 <code>${NAME}</code>"$'\n'
          done

          ESC_DEVICE=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$KERNEL_DEVICE")
          ESC_BRANCH=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$KERNEL_BRANCH")
          ESC_TOOLCHAIN=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$BUILD_TOOLCHAIN")
          ESC_LTO=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$LTO_TYPE")
          ESC_OPT=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$OPT_LEVEL")
          ESC_TICK=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$TICK_RATE")
          ESC_LOCAL=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$LOCAL_VERSION")
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/Build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}"

          MSG="<b>✅ GKI-5.10.x ${CI_VERSION}</b>"$'\n\n'
          MSG+="<b>Device:</b> <code>${ESC_DEVICE}_defconfig</code>"$'\n'
          MSG+="<b>Branch:</b> <code>${ESC_BRANCH}</code>"$'\n'
          if [ -n "$ESC_LOCAL" ]; then
            MSG+="<b>Localversion:</b> <code>${ESC_LOCAL}</code>"$'\n'
          fi
          MSG+="<b>Toolchain:</b> <code>${ESC_TOOLCHAIN}</code>"$'\n'
          MSG+="<b>Compiler:</b> LTO: <code>${ESC_LTO}</code> | Opt: <code>${ESC_OPT}</code> | Tick: <code>${ESC_TICK}</code>"$'\n'
          MSG+="<b>Commit:</b> <code>${COMMIT_SHA}</code> (Run #${GITHUB_RUN_NUMBER})"$'\n\n'
          MSG+="<b>Packages:</b>"$'\n'"${LIST}"$'\n'
          MSG+="<a href='${RELEASE_URL}'>Download Release</a>"

          curl -sfS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=$MSG" > /dev/null

  notify-failure:
    name: "Notify Failure"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-kernel, package-release]
    if: ${{ always() && (needs.build-kernel.result == 'failure' || needs.package-release.result == 'failure') }}
    env:
      KERNEL_DEVICE: ${{ github.event.inputs.kernelDevice }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernelBranch }}
      BUILD_TOOLCHAIN: ${{ github.event.inputs.buildToolchain }}
      LTO_TYPE: ${{ github.event.inputs.ltoType }}
      OPT_LEVEL: ${{ github.event.inputs.optimizationLevel }}
      TICK_RATE: ${{ github.event.inputs.tickRate }}
    steps:
      - name: "Send Telegram Failure Alert"
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not configured; skipping notification."
            exit 0
          fi

          ESC_DEVICE=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$KERNEL_DEVICE")
          ESC_BRANCH=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$KERNEL_BRANCH")
          ESC_TOOLCHAIN=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$BUILD_TOOLCHAIN")
          ESC_LTO=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$LTO_TYPE")
          ESC_OPT=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$OPT_LEVEL")
          ESC_TICK=$(python3 -c 'import html, sys; print(html.escape(sys.argv[1]))' "$TICK_RATE")
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          MSG="<b>❌ GKI-5.10.x Build Failed</b>"$'\n\n'
          MSG+="<b>Device:</b> <code>${ESC_DEVICE}_defconfig</code>"$'\n'
          MSG+="<b>Branch:</b> <code>${ESC_BRANCH}</code>"$'\n'
          MSG+="<b>Toolchain:</b> <code>${ESC_TOOLCHAIN}</code>"$'\n'
          MSG+="<b>Compiler:</b> LTO: <code>${ESC_LTO}</code> | Opt: <code>${ESC_OPT}</code> | Tick: <code>${ESC_TICK}</code>"$'\n'
          MSG+="<b>Run:</b> #${GITHUB_RUN_NUMBER}"$'\n\n'
          MSG+="<a href='${RUN_URL}'>View Workflow Logs</a>"

          curl -sfS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=$MSG" > /dev/null
